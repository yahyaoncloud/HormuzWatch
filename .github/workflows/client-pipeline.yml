name: Pipeline 3 - Client (React Vite & Vercel Deployment)

on:
  push:
    branches:
      - main
      - production-ready
    paths:
      - 'client/**'
      - '.github/workflows/client-pipeline.yml'
  workflow_dispatch:

jobs:
  build-and-deploy-client:
    name: Build Client and Deploy to Vercel
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: |
          cd client
          npm ci --legacy-peer-deps

      - name: Verify TypeScript & Build
        run: |
          cd client
          npm run build
        env:
          VITE_API_BASE_URL: "https://api.hormuzwatch.aburcloud.com"
          VITE_WS_TELEMETRY_URL: "wss://api.hormuzwatch.aburcloud.com/ws/stream"
          VITE_SSE_TRACES_URL: "https://api.hormuzwatch.aburcloud.com/public/stream"
          VITE_ML_SERVICE_URL: "https://ml.hormuzwatch.aburcloud.com"

      - name: Deploy to Vercel (Production)
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/production-ready'
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: ./client
          vercel-args: '--prod'
          alias-domains: |
            hormuzwatch.vercel.app
