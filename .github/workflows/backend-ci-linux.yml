# HormuzWatch — Auto-build on Linux (for future migration)
name: Backend CI (Linux)

on:
  push:
    branches: [main, master]
    paths:
      - "server/**"
      - "ml-service/**"
      - ".github/workflows/backend-ci-linux.yml"

defaults:
  run:
    shell: bash

jobs:
  build-go:
    name: Build Go Backend
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: true
          cache-dependency-path: server/go.sum

      - name: Build
        working-directory: server
        run: |
          go build -o ../build/hormuz-server ./cmd/...
          chmod +x ../build/hormuz-server

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: hormuz-server-linux
          path: build/hormuz-server

  build-python:
    name: Verify Python ML Service
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        working-directory: ml-service
        run: pip install -r requirements.txt --quiet

      - name: Verify imports
        working-directory: ml-service
        run: python3 -c "from app import app; print('ML service imports OK')"

      - name: Verify CLI
        working-directory: ml-service
        run: python3 ml_cli.py status || true  # OK if not running, just verify syntax

  test:
    name: Run Go Tests
    runs-on: ubuntu-latest
    timeout-minutes: 5

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: hormuzwatch_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Run tests
        working-directory: server
        env:
          DATABASE_URL: postgres://test:test@localhost:5432/hormuzwatch_test?sslmode=disable
        run: go test ./... -v -count=1 -timeout 60s
