global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  # ── Go Backend Server Metrics (Distributed) ─────────────────
  - job_name: "hormuzwatch-server-prod"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["192.168.1.40:10020"]
        labels:
          tier: "backend"
          env: "production"
          node: "late5530"

  - job_name: "hormuzwatch-server-dev"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["192.168.1.35:10020", "server:10020", "host.docker.internal:10020"]
        labels:
          tier: "backend"
          env: "dev"
          node: "tp24"

  # ── Python ML Anomaly Detection Service ────────────────────
  - job_name: "hormuzwatch-ml-prod"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["192.168.1.40:8090"]
        labels:
          tier: "ml-service"
          env: "production"
          node: "late5530"

  - job_name: "hormuzwatch-ml-dev"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["192.168.1.35:8090", "ml:8090", "host.docker.internal:8090"]
        labels:
          tier: "ml-service"
          env: "dev"
          node: "tp24"

  # ── Host Hardware & OS Metrics (Node Exporter) ─────────────
  - job_name: "node-exporter"
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          tier: "infrastructure"
          host: "tunkstun"
      - targets: ["192.168.1.40:9100"]
        labels:
          tier: "infrastructure"
          host: "late5530"
      - targets: ["192.168.1.35:9100"]
        labels:
          tier: "infrastructure"
          host: "tp24"

  # ── Container Metrics (cAdvisor) ───────────────────────────
  - job_name: "cadvisor"
    static_configs:
      - targets: ["cadvisor:8080"]
        labels:
          tier: "containers"
          host: "tunkstun"

  # ── Prometheus Internal Telemetry ──────────────────────────
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
