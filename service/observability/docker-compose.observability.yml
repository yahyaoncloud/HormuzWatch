# HormuzWatch — Observability & SRE Stack (Prometheus, Grafana, Node Exporter & cAdvisor)
# Usage: docker compose -f service/observability/docker-compose.observability.yml up -d

services:
  # ── Prometheus Time-Series Metrics Engine ───────────────────
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: hormuzwatch-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
    networks:
      - hormuzwatch-obs
      - hormuzwatch-dev-network
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ── Grafana SRE & Observability Dashboards ──────────────────
  grafana:
    image: grafana/grafana:11.1.0
    container_name: hormuzwatch-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/etc/grafana/provisioning/dashboards/hormuzwatch-sre.json
    volumes:
      - ./datasources:/etc/grafana/provisioning/datasources:ro
      - ./dashboards:/etc/grafana/provisioning/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - hormuzwatch-obs
      - hormuzwatch-dev-network

  # ── Prometheus Node Exporter (Host Hardware & OS Metrics) ───
  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: hormuzwatch-node-exporter
    restart: unless-stopped
    pid: host
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - "--path.procfs=/host/proc"
      - "--path.rootfs=/rootfs"
      - "--path.sysfs=/host/sys"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
    networks:
      - hormuzwatch-obs
      - hormuzwatch-dev-network

  # ── cAdvisor (Container Resource Usage & Throttling) ────────
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: hormuzwatch-cadvisor
    restart: unless-stopped
    privileged: true
    ports:
      - "8080:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    devices:
      - /dev/kmsg
    networks:
      - hormuzwatch-obs
      - hormuzwatch-dev-network

networks:
  hormuzwatch-obs:
    driver: bridge
    name: hormuzwatch-obs-network
  hormuzwatch-dev-network:
    external: true

volumes:
  prometheus-data:
    name: hormuzwatch-prometheus-data
  grafana-data:
    name: hormuzwatch-grafana-data
