# HormuzWatch — Observability & SRE Stack (Prometheus & Grafana)
# Usage: docker compose -f service/observability/docker-compose.observability.yml up -d

version: "3.9"

services:
  # ── Prometheus Time-Series Metrics Engine ───────────────────
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: hormuzwatch-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
    networks:
      - hormuzwatch-obs
      - hormuzwatch-network
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ── Grafana SRE & Observability Dashboards ──────────────────
  grafana:
    image: grafana/grafana:11.1.0
    container_name: hormuzwatch-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/etc/grafana/provisioning/dashboards/hormuzwatch-sre.json
    volumes:
      - ./datasources:/etc/grafana/provisioning/datasources:ro
      - ./dashboards:/etc/grafana/provisioning/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - hormuzwatch-obs
      - hormuzwatch-network

networks:
  hormuzwatch-obs:
    driver: bridge
    name: hormuzwatch-obs-network
  hormuzwatch-network:
    external: true

volumes:
  prometheus-data:
    name: hormuzwatch-prometheus-data
  grafana-data:
    name: hormuzwatch-grafana-data
