# HormuzWatch — Blue Deployment Slot Override
services:
  server:
    container_name: hormuzwatch-server-blue
    ports:
      - "10020:10020"
    environment:
      - PORT=10020
      - SERVER_PORT=10020
      - ML_SERVICE_ADDR=ml:8091
      - ML_SERVICE_URL=http://ml:8090

  ml:
    container_name: hormuzwatch-ml-blue
    ports:
      - "8090:8090"
      - "8091:8091"
    environment:
      - ML_PORT=8090
      - GRPC_PORT=8091
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8090/health || exit 1"]

  client:
    container_name: hormuzwatch-client-blue
    ports:
      - "3000:3000"
    environment:
      - CLIENT_PORT=3000
