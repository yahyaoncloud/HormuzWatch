---
- name: Update apt cache and install base utilities
  ansible.builtin.apt:
    update_cache: true
    pkg:
      - curl
      - git
      - htop
      - jq
      - rsync
      - build-essential
      - python3-pip
      - python3-venv
      - ufw
      - tar
      - gzip
      - ca-certificates
    state: present

- name: Configure kernel sysctl parameters for high-throughput streaming
  ansible.posix.sysctl:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    state: present
    reload: true
  loop:
    - { name: 'fs.file-max', value: '2097152' }
    - { name: 'net.core.somaxconn', value: '65535' }
    - { name: 'vm.max_map_count', value: '262144' }

- name: Ensure target project and dataset directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0755'
  loop:
    - "{{ target_project_dir }}"
    - "/server/datasets"
    - "{{ target_project_dir }}/server/datasets"
    - "{{ target_project_dir }}/service/ml-service/models"
