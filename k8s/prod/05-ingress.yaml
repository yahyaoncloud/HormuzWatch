apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hormuzwatch-ingress
  namespace: hormuzwatch-prod
  annotations:
    ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/websocket-services: "server"
spec:
  rules:
    - host: hormuzwatch.aburcloud.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: server
                port:
                  number: 10020
          - path: /ws
            pathType: Prefix
            backend:
              service:
                name: server
                port:
                  number: 10020
          - path: /health
            pathType: Prefix
            backend:
              service:
                name: server
                port:
                  number: 10020
          - path: /public
            pathType: Prefix
            backend:
              service:
                name: server
                port:
                  number: 10020
          - path: /auth
            pathType: Prefix
            backend:
              service:
                name: server
                port:
                  number: 10020
          - path: /
            pathType: Prefix
            backend:
              service:
                name: hormuzwatch-client
                port:
                  number: 3000
