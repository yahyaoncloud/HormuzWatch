apiVersion: v1
kind: ConfigMap
metadata:
  name: hormuzwatch-config
  namespace: hormuzwatch-prod
data:
  PORT: "10020"
  GIN_MODE: "release"
  AUTH_DISABLED: "false"
  ML_SERVICE_ADDR: "hormuzwatch-ml.hormuzwatch-prod.svc.cluster.local:8091"
  ML_SERVICE_TLS: "off"
  ML_SERVICE_URL: "http://hormuzwatch-ml.hormuzwatch-prod.svc.cluster.local:8090"
  DATABASE_URL: "postgres://postgres:${POSTGRES_PASSWORD}@postgres.hormuzwatch-prod.svc.cluster.local:5432/hormuzwatch?sslmode=disable"
  POSTGRES_DB: "hormuzwatch"
  POSTGRES_USER: "postgres"
---
apiVersion: v1
kind: Secret
metadata:
  name: hormuzwatch-secrets
  namespace: hormuzwatch-prod
type: Opaque
stringData:
  POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-change_me_in_production}"
  JWT_SECRET: "${JWT_SECRET:-change_me_jwt_secret_token}"
