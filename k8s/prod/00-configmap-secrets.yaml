apiVersion: v1
kind: ConfigMap
metadata:
  name: hormuzwatch-config
  namespace: hormuzwatch-prod
data:
  PORT: "10020"
  GIN_MODE: "release"
  AUTH_DISABLED: "false"
  ML_SERVICE_ADDR: "hormuzwatch-ml.hormuzwatch-prod.svc.cluster.local:8091"
  ML_SERVICE_TLS: "off"
  ML_SERVICE_URL: "http://hormuzwatch-ml.hormuzwatch-prod.svc.cluster.local:8090"
  POSTGRES_DB: "hormuzwatch"
  POSTGRES_USER: "postgres"
---
apiVersion: v1
kind: Secret
metadata:
  name: hormuzwatch-secrets
  namespace: hormuzwatch-prod
type: Opaque
stringData:
  POSTGRES_PASSWORD: "Yahya@123"
  DATABASE_URL: "postgres://postgres:Yahya@123@postgres.hormuzwatch-prod.svc.cluster.local:5432/hormuzwatch?sslmode=disable"
  JWT_SECRET: "change_me_jwt_secret_token"
