# HormuzWatch — Development Docker Compose
# Usage: docker compose -f docker-compose.dev.yml up --build

services:
  # ── Go Backend Server (Dev Mode) ───────────────────────────
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
      args:
        VERSION: "dev-2.0.0"
        BUILD_TIME: "dev"
        GIT_COMMIT: "local"
    image: hormuzwatch-server:dev
    container_name: hormuzwatch-server-dev
    ports:
      - "10020:10020"
    environment:
      - PORT=10020
      - GIN_MODE=debug
      - AUTH_DISABLED=true
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:Yahya%40123@postgres:5432/hormuzwatch?sslmode=disable}
      - JWT_SECRET=${JWT_SECRET:-dev-jwt-secret-at-least-32-chars-long!}
      - SUPABASE_JWT_SECRET=${SUPABASE_JWT_SECRET:-}
      - SUPABASE_URL=${SUPABASE_URL:-}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY:-}
      - ML_SERVICE_ADDR=ml:8091
      - ML_SERVICE_TLS=off
      - ML_SERVICE_URL=http://ml:8090
      - AISSTREAM_API_KEY=${AISSTREAM_API_KEY:-}
      - OPENSKY_USERNAME=${OPENSKY_USERNAME:-}
      - OPENSKY_PASSWORD=${OPENSKY_PASSWORD:-}
      - FIRMS_MAP_KEY=${FIRMS_MAP_KEY:-}
      - METRICS_API_KEY=${METRICS_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      # ArcGIS Chokepoints API
      - ARCGIS_CHOKEPOINTS_URL=https://services9.arcgis.com/weJ1QsnbMYJlCHdG/arcgis/rest/services/Daily_Chokepoints_Data/FeatureServer/0/query
      - ARCGIS_FETCH_INTERVAL_HOURS=6
    depends_on:
      postgres:
        condition: service_healthy
      ml:
        condition: service_healthy
    networks:
      - hormuzwatch-dev
    restart: unless-stopped

  # ── Local PostgreSQL Database (Dev Mode) ───────────────────
  postgres:
    image: postgres:16-alpine
    container_name: hormuzwatch-postgres-dev
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=Yahya@123
      - POSTGRES_DB=hormuzwatch
    ports:
      - "5433:5432"
    volumes:
      - pgdata-dev:/var/lib/postgresql/data
    networks:
      - hormuzwatch-dev
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hormuzwatch"]
      interval: 3s
      timeout: 3s
      retries: 5

  # ── Python ML Service (Dev Mode) ───────────────────────────
  ml:
    build:
      context: ./service/ml-service
      dockerfile: Dockerfile
      args:
        VERSION: "dev-2.0.0"
    image: hormuzwatch-ml:dev
    container_name: hormuzwatch-ml-dev
    ports:
      - "8090:8090"
      - "8091:8091"
    environment:
      - ML_PORT=8090
      - GRPC_PORT=8091
      - MODELS_DIR=/app/models
      - APP_VERSION=dev-2.0.0
    volumes:
      - ml-models-dev:/app/models
    networks:
      - hormuzwatch-dev
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8090/health"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 3

  # ── React Frontend (Dev / Nginx Mode) ──────────────────────
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: "http://localhost:10020"
        VITE_APP_VERSION: "dev-2.0.0"
    image: hormuzwatch-client:dev
    container_name: hormuzwatch-client-dev
    ports:
      - "3000:3000"
    depends_on:
      server:
        condition: service_started
    networks:
      - hormuzwatch-dev
    restart: unless-stopped

  # ── Dedicated Dataset Worker (Dev Profile) ─────────────────
  dataset-worker:
    build:
      context: ./server
      dockerfile: Dockerfile.dataset-worker
    image: hormuzwatch-dataset-worker:dev
    container_name: hormuzwatch-dataset-worker-dev
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:Yahya%40123@postgres:5432/hormuzwatch?sslmode=disable}
      - DATASET_OUTPUT_DIR=/server/datasets
      - DATASET_DOMAINS=vessel,aircraft
      - DATASET_LOOKBACK_HOURS=2.0
      - DATASET_RETENTION=7
    volumes:
      - dataset-worker-data-dev:/server/datasets
    networks:
      - hormuzwatch-dev
    profiles:
      - worker
      - all
    restart: unless-stopped

networks:
  hormuzwatch-dev:
    driver: bridge
    name: hormuzwatch-dev-network

volumes:
  ml-models-dev:
    name: hormuzwatch-ml-models-dev
  pgdata-dev:
    name: hormuzwatch-pgdata-dev
  dataset-worker-data-dev:
    name: hormuzwatch-dataset-worker-data-dev
