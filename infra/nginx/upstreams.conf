# Managed by Ansible & SRE - Upstreams & Ingress for LATE5530
upstream hormuzwatch_frontend {
    least_conn;
    server 127.0.0.1:3000 max_fails=2 fail_timeout=5s;
    keepalive 32;
}
upstream hormuzwatch_backend {
    least_conn;
    server 127.0.0.1:10020 max_fails=2 fail_timeout=5s;
    keepalive 32;
}
upstream jenkins_backend {
    server 192.168.1.35:8085 max_fails=2 fail_timeout=5s;
    server 100.126.193.36:8085 backup;
    keepalive 32;
}

server {
    listen 127.0.0.1:80;
    server_name hormuzwatch.aburcloud.com;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline' 'unsafe-eval' wss:;" always;

    limit_req zone=req_limit_per_ip burst=60 nodelay;
    limit_conn conn_limit_per_ip 30;

    proxy_intercept_errors on;
    error_page 500 502 503 504 /offline.html;

    location /github-webhook/ {
        proxy_pass http://jenkins_backend/github-webhook/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    # Static System Status & Diagnostic Fallback
    location = /offline.html {
        root /home/yahya/SHARED/Projects/HormuzWatch/static-site;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    location = /boot_log.html {
        root /home/yahya/SHARED/Projects/HormuzWatch/static-site;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # Public API & Telemetry Routes
    location /public/ {
        proxy_pass http://hormuzwatch_backend/public/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 2s;
        proxy_read_timeout 60s;
    }

    # Health Checks
    location /health {
        proxy_pass http://hormuzwatch_backend/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_connect_timeout 2s;
    }

    # Authentication Endpoints
    location /auth/ {
        proxy_pass http://hormuzwatch_backend/auth/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 2s;
    }

    # API endpoints
    location /api/ {
        proxy_pass http://hormuzwatch_backend/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 2s;
        proxy_read_timeout 60s;
    }

    # WebSocket live stream
    location /ws {
        proxy_pass http://hormuzwatch_backend/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Main Frontend Application
    location / {
        proxy_pass http://hormuzwatch_frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 2s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }
}

server {
    listen 127.0.0.1:80;
    server_name api.aburcloud.com api.hormuzwatch.aburcloud.com;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        proxy_pass http://hormuzwatch_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 3s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }
}
