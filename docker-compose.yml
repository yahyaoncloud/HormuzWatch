# HormuzWatch — Production Docker Compose
# Usage: docker compose -f docker-compose.yml up --build -d

services:
  # ── Go Backend Server (Production) ─────────────────────────
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
      args:
        VERSION: "${VERSION:-2.0.0}"
        BUILD_TIME: "${BUILD_TIME}"
        GIT_COMMIT: "${GIT_COMMIT}"
    image: hormuzwatch-server:${VERSION:-2.0.0}
    container_name: hormuzwatch-server
    ports:
      - "${SERVER_PORT:-10020}:${PORT:-10020}"
    environment:
      - PORT=${PORT:-10020}
      - GIN_MODE=${GIN_MODE:-release}
      # Database (Supabase PostgreSQL)
      - DATABASE_URL=${DATABASE_URL}
      # Auth
      - JWT_SECRET=${JWT_SECRET}
      - SUPABASE_JWT_SECRET=${SUPABASE_JWT_SECRET}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - AUTH_DISABLED=${AUTH_DISABLED:-false}
      # ML service bridge
      - ML_SERVICE_ADDR=ml:8091
      - ML_SERVICE_TLS=off
      - ML_SERVICE_URL=http://ml:8090
      # External data sources
      - AISSTREAM_API_KEY=${AISSTREAM_API_KEY:-}
      - OPENSKY_USERNAME=${OPENSKY_USERNAME:-}
      - OPENSKY_PASSWORD=${OPENSKY_PASSWORD:-}
      - FIRMS_MAP_KEY=${FIRMS_MAP_KEY:-}
      - METRICS_API_KEY=${METRICS_API_KEY:-}
      # LLM (OpenRouter)
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      # ArcGIS Chokepoints API
      - ARCGIS_CHOKEPOINTS_URL=https://services9.arcgis.com/weJ1QsnbMYJlCHdG/arcgis/rest/services/Daily_Chokepoints_Data/FeatureServer/0/query
      - ARCGIS_FETCH_INTERVAL_HOURS=6
      # Observability
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    depends_on:
      postgres:
        condition: service_healthy
      ml:
        condition: service_healthy
    networks:
      - hormuzwatch
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── PostgreSQL Database (Production) ───────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: hormuzwatch-postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-Yahya@123}
      - POSTGRES_DB=hormuzwatch
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    command: ["postgres", "-c", "shared_buffers=128MB", "-c", "work_mem=4MB", "-c", "maintenance_work_mem=32MB", "-c", "max_connections=50"]
    networks:
      - hormuzwatch
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hormuzwatch"]
      interval: 3s
      timeout: 3s
      retries: 5

  # ── Python ML Service (Production) ─────────────────────────
  ml:
    build:
      context: ./service/ml-service
      dockerfile: Dockerfile
      args:
        VERSION: "${VERSION:-2.0.0}"
    image: hormuzwatch-ml:${VERSION:-2.0.0}
    container_name: hormuzwatch-ml
    ports:
      - "8090:8090"
      - "8091:8091"
    environment:
      - ML_PORT=8090
      - GRPC_PORT=8091
      - MODELS_DIR=/app/models
      - APP_VERSION=${VERSION:-2.0.0}
    volumes:
      - ml-models:/app/models
    networks:
      - hormuzwatch
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 2048M
        reservations:
          cpus: '0.5'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:${ML_PORT:-8090}/health || exit 1"]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 3

  # ── React Frontend (Production / Nginx) ────────────────────
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: "${VITE_API_BASE_URL:-http://localhost:10020}"
        VITE_SUPABASE_URL: "${VITE_SUPABASE_URL}"
        VITE_SUPABASE_ANON_KEY: "${VITE_SUPABASE_ANON_KEY}"
        VITE_APP_VERSION: "${VERSION:-2.0.0}"
    image: hormuzwatch-client:${VERSION:-2.0.0}
    container_name: hormuzwatch-client
    ports:
      - "${CLIENT_PORT:-3000}:3000"
    depends_on:
      server:
        condition: service_started
    networks:
      - hormuzwatch
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
        reservations:
          cpus: '0.1'
          memory: 32M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── Dedicated Dataset Worker (Decoupled Background ETL) ───
  dataset-worker:
    build:
      context: ./server
      dockerfile: Dockerfile.dataset-worker
    image: hormuzwatch-dataset-worker:1.0.0
    container_name: hormuzwatch-dataset-worker
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - DATASET_OUTPUT_DIR=/server/datasets
      - DATASET_DOMAINS=vessel,aircraft
      - DATASET_LOOKBACK_HOURS=2.0
      - DATASET_RETENTION=14
    volumes:
      - /server/datasets:/server/datasets
    networks:
      - hormuzwatch
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  hormuzwatch:
    driver: bridge
    name: hormuzwatch-network

volumes:
  ml-models:
    name: hormuzwatch-ml-models
  pgdata:
    name: hormuzwatch-pgdata
