# HormuzWatch v2.0.0 — Production Docker Compose
#
# Services:
#   server  — Go backend (REST + WebSocket + gRPC client)
#   ml      — Python ML inference (IsolationForest + LOF ensemble)
#   client  — React SPA (Nginx, production build)
#
# Usage:
#   docker compose up -d --build              # full stack
#   docker compose up -d server ml            # backend only
#   docker compose --profile full up -d       # with client
#   docker compose logs -f server             # tail server logs
#   docker compose ps                         # service status
#
# Access:
#   Server API  → http://localhost:10020/health
#   ML Health   → http://localhost:8090/health
#   Client      → http://localhost:3000

version: "3.9"

services:
  # ═══════════════════════════════════════════════════════════
  #  Go Backend — REST API + WebSocket + News Pipeline
  # ═══════════════════════════════════════════════════════════
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
      args:
        VERSION: "${VERSION:-2.0.0}"
        BUILD_TIME: "${BUILD_TIME:-unknown}"
        GIT_COMMIT: "${GIT_COMMIT:-unknown}"
    image: hormuzwatch-server:${VERSION:-2.0.0}
    container_name: hormuzwatch-server
    ports:
      - "${PORT:-10020}:10020"
    environment:
      - PORT=10020
      - GIN_MODE=${GIN_MODE:-release}
      # Database (Supabase PostgreSQL)
      - DATABASE_URL=${DATABASE_URL}
      # Auth
      - JWT_SECRET=${JWT_SECRET}
      - SUPABASE_JWT_SECRET=${SUPABASE_JWT_SECRET}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - AUTH_DISABLED=${AUTH_DISABLED:-false}
      # ML service bridge
      - ML_SERVICE_ADDR=ml:8091
      - ML_SERVICE_TLS=off
      - ML_SERVICE_URL=http://ml:8090
      # External data sources
      - AISSTREAM_API_KEY=${AISSTREAM_API_KEY:-}
      - OPENSKY_USERNAME=${OPENSKY_USERNAME:-}
      - OPENSKY_PASSWORD=${OPENSKY_PASSWORD:-}
      - FIRMS_MAP_KEY=${FIRMS_MAP_KEY:-}
      - METRICS_API_KEY=${METRICS_API_KEY:-}
      # LLM (OpenRouter)
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      # Observability
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    depends_on:
      ml:
        condition: service_healthy
    networks:
      - hormuzwatch
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:10020/health"]
      interval: 15s
      timeout: 5s
      start_period: 15s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  # ═══════════════════════════════════════════════════════════
  #  Python ML Service — Anomaly Detection Ensemble
  # ═══════════════════════════════════════════════════════════
  ml:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
      args:
        VERSION: "${VERSION:-2.0.0}"
    image: hormuzwatch-ml:${VERSION:-2.0.0}
    container_name: hormuzwatch-ml
    ports:
      - "${ML_PORT:-8090}:8090"    # FastAPI health/train/predict
      - "${GRPC_PORT:-8091}:8091"  # gRPC inference
    environment:
      - ML_PORT=8090
      - GRPC_PORT=8091
      - MODELS_DIR=/app/models
      - APP_VERSION=${VERSION:-2.0.0}
    volumes:
      - ml-models:/app/models
    networks:
      - hormuzwatch
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8090/health"]
      interval: 15s
      timeout: 5s
      start_period: 15s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  # ═══════════════════════════════════════════════════════════
  #  React Frontend — Production Nginx SPA
  # ═══════════════════════════════════════════════════════════
  client:
    build:
      context: ./client-v2
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: "${VITE_API_BASE_URL:-http://localhost:10020}"
        VITE_SUPABASE_URL: "${SUPABASE_URL}"
        VITE_SUPABASE_ANON_KEY: "${SUPABASE_ANON_KEY}"
        VITE_APP_VERSION: "${VERSION:-2.0.0}"
    image: hormuzwatch-client:${VERSION:-2.0.0}
    container_name: hormuzwatch-client
    ports:
      - "3000:3000"
    depends_on:
      server:
        condition: service_started
    networks:
      - hormuzwatch
    profiles:
      - full
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/"]
      interval: 15s
      timeout: 5s
      start_period: 5s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

networks:
  hormuzwatch:
    driver: bridge
    name: hormuzwatch-network

volumes:
  ml-models:
    name: hormuzwatch-ml-models
